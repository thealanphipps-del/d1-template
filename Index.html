<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/thealanphipps-del/recovery-hub/style.css?v=3">
  </head>
  <body>
    <div id="dynamic-content">Initializing Forensic Environment...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      fetch('https://cdn.jsdelivr.net/gh/thealanphipps-del/recovery-hub/app.js?v=3')
        .then(response => response.text())
        .then(code => {
          eval(code); 
          renderInterface(); 
        })
        .catch(err => {
          document.getElementById('dynamic-content').innerHTML = "Bridge Error: " + err;
        });

      function serverCall(prompt) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .callGemini(prompt);
        });
      }
    </script>
  </body>
</html>
